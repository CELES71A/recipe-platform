<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食谱与烹饪助手</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a href="#">食谱与烹饪助手</a><nav><button id="home">发现食谱</button><button id="my">我的收藏与记录</button><button id="account">登录 / 注册</button><button id="logout" hidden>退出</button><button id="admin" hidden>管理</button></nav></header>
<main><p id="notice" role="status" aria-live="polite"></p><section id="browse"><div class="hero"><p>FIND · COOK · REMEMBER</p><h1>今天，做点什么？</h1><p>从真实食谱中寻找灵感，收藏喜欢的菜，按步骤完成一道料理。</p><p id="stats"></p></div><form id="search-form"><label>英文菜名<input name="q" placeholder="chicken / pasta" maxlength="100"></label><label>分类<select name="category_id"><option value="">所有分类</option></select></label><label>总时长<select name="max_minutes"><option value="">不限</option><option value="15">15分钟内</option><option value="30">30分钟内</option><option value="60">1小时内</option></select></label><label>来源评分<select name="min_rating"><option value="">不限</option><option value="4">4分以上</option><option value="4.5">4.5分以上</option></select></label><label>排序<select name="sort"><option value="id">默认</option><option value="rating">来源评分</option><option value="time">总时长</option></select></label><button class="primary">搜索食谱</button></form><p id="result-count"></p><div id="recipes" class="grid"></div><div class="pager"><button id="previous">上一页</button><span id="page-label"></span><button id="next">下一页</button></div></section>
<section id="personal" hidden><h1>我的厨房</h1><h2>收藏</h2><div id="favorites" class="grid"></div><h2>我的评价</h2><div id="my-reviews"></div><h2>烹饪记录</h2><div id="history"></div></section>
<section id="administration" hidden><h1>管理</h1><p>输入食谱 ID 可发布、下架或转为草稿。导入批次显示真实导入报告。</p><form id="status-form"><input name="id" type="number" min="1" required placeholder="食谱 ID"><select name="status"><option value="published">发布</option><option value="archived">下架</option><option value="draft">草稿</option></select><button>保存状态</button></form><pre id="import-history"></pre></section>
</main>
<dialog id="auth-dialog"><form id="auth-form"><h2>登录 / 注册</h2><label>邮箱<input name="email" type="email" required maxlength="254" autocomplete="username"></label><label>密码（至少8位）<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label><p id="auth-error" role="alert"></p><button name="action" value="login" class="primary">登录</button><button name="action" value="register">注册</button><button type="button" id="close-auth">取消</button></form></dialog>
<dialog id="detail-dialog"><button id="close-detail" class="close">关闭</button><div id="detail"></div></dialog>
<dialog id="cook-dialog"><h2 id="cook-title"></h2><p id="cook-position"></p><p id="cook-instruction"></p><div class="actions"><button id="step-back">上一步</button><button id="step-next">下一步</button><button id="pause">暂停</button><button id="complete">完成烹饪</button><button id="close-cook">关闭</button></div><p>每次操作均保存到数据库；关闭后从“我的厨房”恢复。</p></dialog>
<script type="module" src="app.js"></script></body></html>
